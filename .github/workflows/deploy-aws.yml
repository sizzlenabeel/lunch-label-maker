name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload versioned build assets
        run: >-
          aws s3 sync dist/assets/ "s3://${{ vars.AWS_S3_BUCKET }}/assets/"
          --delete
          --cache-control "public,max-age=31536000,immutable"

      - name: Upload public files
        run: >-
          aws s3 sync dist/ "s3://${{ vars.AWS_S3_BUCKET }}/"
          --delete
          --exclude "assets/*"
          --exclude "index.html"
          --cache-control "public,max-age=3600"

      - name: Upload application shell
        run: >-
          aws s3 cp dist/index.html "s3://${{ vars.AWS_S3_BUCKET }}/index.html"
          --cache-control "no-cache,no-store,must-revalidate"
          --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront cache
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/*"
